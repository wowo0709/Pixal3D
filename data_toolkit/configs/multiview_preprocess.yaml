  render_workers_per_gpu_steps: [2, 3, 4]
  encoder_micro_batches: [[256, 16], [512, 8], [1024, 4], [64, 16]]
limits: {cpu_soft_percent: 80.0, cpu_hard_percent: 90.0, load_soft: 72.0, io_wait_soft_percent: 10.0, ram_soft_available_gib: 96, ram_hard_available_gib: 64, local_free_percent: 15.0, local_free_gib: 120, data2_soft_tib: 16, data2_hard_tib: 18, data2_fs_free_tib: 2, data3_soft_tib: 26, data3_fs_free_tib: 4, swap_soft_mib_per_minute: 256, swap_soft_samples: 3, cpu_temp_soft_celsius: 85, cpu_temp_hard_celsius: 92, gpu_temp_soft_celsius: 80, gpu_temp_hard_celsius: 88, temperature_soft_seconds: 30, recovery_stable_seconds: 30}
